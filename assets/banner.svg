<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Radial Glow Orbs -->
  <circle cx="200" cy="120" r="220" fill="url(#glowLeft)" />
  <circle cx="1000" cy="280" r="240" fill="url(#glowRight)" />

  <!-- Grid Lines Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Decorative Side Cards (Dynamic UI Elements) -->
  <g transform="translate(60, 70)" opacity="0.65">
    <rect width="210" height="110" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <circle cx="24" cy="24" r="5" fill="#ef4444" />
    <circle cx="40" cy="24" r="5" fill="#f59e0b" />
    <circle cx="56" cy="24" r="5" fill="#10b981" />
    <rect x="24" y="46" width="110" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.25" />
    <rect x="24" y="62" width="150" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.15" />
    <rect x="24" y="75" width="90" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.15" />
  </g>

  <g transform="translate(930, 220)" opacity="0.65">
    <rect width="210" height="110" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <path d="M 20 75 Q 50 45 80 55 T 140 30 T 190 35" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="140" cy="30" r="4" fill="#38bdf8" />
    <rect x="20" y="20" width="80" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.25" />
  </g>

  <!-- Divider Glow Line -->
  <rect x="200" y="205" width="800" height="2" fill="url(#lineGrad)" />

  <!-- Center Foreground Content -->
  <g transform="translate(600, 185)" text-anchor="middle">

    <!-- Category Pill Tag -->
    <rect x="-150" y="-120" width="300" height="28" rx="14" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="-101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED SAAS &amp; OPEN-SOURCE ECOSYSTEM</text>

    <!-- Main Title Shadow / Backing for Contrast -->
    <text x="0" y="-42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#0f172a" opacity="0.8" letter-spacing="-0.5">Awesome Interactive Product Demo Platform</text>
    
    <!-- Main Title Gradient Text -->
    <text x="0" y="-45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">Awesome Interactive Product Demo Platform</text>

    <!-- Subtitle -->
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" letter-spacing="0.2">Interactive Product Tours • Demo Sandboxes • Sales &amp; Buyer Enablement Frameworks</text>

    <!-- Feature Badges Bottom Row -->
    <g transform="translate(0, 55)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">🚀 SaaS Demo Platforms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">⚡ Open-Source Builders</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(230, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">📊 Sales Enablement</text>
      </g>
    </g>

  </g>
</svg>
