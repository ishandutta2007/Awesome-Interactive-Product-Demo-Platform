<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* CSS Animations for Dynamic Background Elements */
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes scanline {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .bg-grid {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    .floating-card-1 {
      animation: float1 7s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float2 9s ease-in-out infinite;
    }
    .glow-circle {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .scan-line {
      animation: scanline 8s linear infinite;
    }

    /* Foreground Typography - High Legibility & Z-Index */
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #e2e8f0;
      letter-spacing: 0.2px;
    }
    .banner-tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Background Orbs (Behind elements) -->
  <circle class="glow-circle" cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle class="glow-circle" cx="1000" cy="300" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />

  <!-- Grid Pattern overlay -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Background Dynamic UI Mockup Elements (Decorations on the sides, away from center text) -->
  <g class="floating-card-1" opacity="0.4">
    <rect x="60" y="60" width="220" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="90" cy="90" r="6" fill="#ef4444" />
    <circle cx="106" cy="90" r="6" fill="#f59e0b" />
    <circle cx="122" cy="90" r="6" fill="#10b981" />
    <rect x="90" y="115" width="120" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
    <rect x="90" y="132" width="160" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
  </g>

  <g class="floating-card-2" opacity="0.4">
    <rect x="920" y="220" width="220" height="120" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <path d="M 940 300 Q 970 270 1000 280 T 1060 250 T 1110 260" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="1060" cy="250" r="4" fill="#38bdf8" filter="url(#glow)" />
    <rect x="940" y="240" width="80" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
  </g>

  <!-- Animated Scanline effect across center header -->
  <rect class="scan-line" x="0" y="210" width="400" height="2" fill="url(#pulseLine)" />

  <!-- FOREGROUND CONTENT - Clear, High Contrast, Centered & Unobstructed -->
  <g transform="translate(600, 195)" text-anchor="middle">
    <!-- Category Badge Tag -->
    <rect x="-140" y="-125" width="280" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="0" y="-106" class="banner-tag">CURATED SAAS &amp; OPEN-SOURCE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="-45" class="banner-title" filter="url(#glow)">Awesome Interactive Product Demo Platform</text>
    <text x="0" y="-45" class="banner-title">Awesome Interactive Product Demo Platform</text>

    <!-- Subtitle -->
    <text x="0" y="5" class="banner-subtitle">Interactive Product Tours • Demo Sandboxes • Sales &amp; Buyer Enablement Frameworks</text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 55)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
        <text x="0" y="4" class="pill-text" text-anchor="middle">🚀 SaaS Demo Platforms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
        <text x="0" y="4" class="pill-text" text-anchor="middle">⚡ Open-Source Builders</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(240, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
        <text x="0" y="4" class="pill-text" text-anchor="middle">📊 Sales Enablement</text>
      </g>
    </g>
  </g>
</svg>
